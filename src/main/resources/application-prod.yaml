application:
  openapi:
    title: ${OPENAPI_TITLE}
    version: ${OPENAPI_VERSION}
    description: ${OPENAPI_DESCRIPTION}
    name: ${OPENAPI_NAME}
    email: ${OPENAPI_EMAIL}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true