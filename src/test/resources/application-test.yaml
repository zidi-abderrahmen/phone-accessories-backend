application:
  openapi:
    title: "Phone Accessories API"
    version: "test"
    description: "API for Phone Accessories E-commerce (integration tests)"
    name: "Integration Test"
    email: "test@example.com"

  security:
    jwt:
      secret: cGhvbmUtYWNjZXNzb3JpZXMtaW50ZWdyYXRpb24tdGVzdC1qd3Qtc2lnbmluZy1zZWNyZXQtMjAyNg==
      expiration: 3600000
      refresh-expiration: 604800000
