    url: jdbc:postgresql://localhost:5432/phone_accessories_test
    username: abdo
    password: password

  jpa:
    show-sql: false

app:
  mail:
    api-key: test-mail-api-key
    from: no-reply@test.example
    from-name: Phone Accessories (test)

cors:
  allowed-origins: "http://localhost:4200"

imagekit:
  private-key: test-imagekit-private-key

logging:
  level:
    org.flywaydb: WARN
    org.springframework.security: WARN
