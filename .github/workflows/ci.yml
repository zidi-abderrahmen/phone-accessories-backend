name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/phone_accessories
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      APPLICATION_SECURITY_JWT_SECRET: dGVzdHNlY3JldGtleWZvcmNpMTIzNDU2Nzg5MDEyMzQ1Ng==
      APPLICATION_SECURITY_JWT_EXPIRATION: 900000
      APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION: 604800000
      APPLICATION_SECURITY_JWT_REMEMBER_ME_EXPIRATION: 2592000000
      APPLICATION_SECURITY_COOKIES_SECURE: "false"
      APPLICATION_SECURITY_COOKIES_SAME_SITE: Strict
      APPLICATION_TOKEN_PEPPER: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd
      APPLICATION_FRONTEND_URL: http://localhost:4200
      APPLICATION_OPENAPI_TITLE: "Phone Accessories API"
      APPLICATION_OPENAPI_DESCRIPTION: "API for Phone Accessories E-commerce"
      APPLICATION_OPENAPI_VERSION: 0.1
      APPLICATION_OPENAPI_NAME: Test
      APPLICATION_OPENAPI_EMAIL: test@test.com
      APPLICATION_SUPER_ADMIN_FIRST_NAME: Test
      APPLICATION_SUPER_ADMIN_LAST_NAME: Admin
      APPLICATION_SUPER_ADMIN_EMAIL: admin@test.com
      APPLICATION_SUPER_ADMIN_PASSWORD: TestPassword123!
      APP_MAIL_API_KEY: dummy_api_key
      APP_MAIL_FROM: test@test.com
      APP_MAIL_FROM_NAME: Test
      IMAGEKIT_PRIVATE_KEY: dummy_key
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and test
        run: ./mvnw clean verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: phone_accessories
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  publish-image:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max